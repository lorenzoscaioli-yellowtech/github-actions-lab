# Lezione 04 - Linting e formattazione
#
# Caso d'uso: verificare lo stile del codice con ESLint e Prettier.
# Due job in parallelo: sono verifiche indipendenti e così, se una fallisce,
# si vede subito quale.

name: 04 - Lint e formattazione

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/04-lint.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", ".github/workflows/04-lint.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Il "problem matcher" di setup-node riconosce l'output di ESLint e
      # trasforma ogni errore in un'annotazione sul file, visibile nella tab
      # "Files changed" della PR.
      - run: npm run lint

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # `--check` NON modifica i file: fallisce se qualcosa non è formattato.
      # In CI non si formatta mai in automatico sul branch dell'autore senza
      # un accordo esplicito; si segnala e basta.
      - run: npm run format:check
