# Lezione 04 - Linting e formattazione
#
# Caso d'uso: verificare lo stile del codice con ESLint e Prettier.
# Due job in parallelo: sono verifiche indipendenti e così, se una fallisce,
# si vede subito quale.
#
# Dalla lezione 10 i due job non sono più scritti qui: richiamano il reusable
# workflow 10-node-check.yml. Confronta con la versione precedente nella
# storia git: `git log -p .github/workflows/04-lint.yml`.

name: 04 - Lint e formattazione

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/04-lint.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", ".github/workflows/04-lint.yml"]

permissions:
  contents: read

jobs:
  # ESLint: il problem matcher di setup-node trasforma gli errori in
  # annotazioni sulle righe del file, visibili nella tab "Files changed".
  eslint:
    uses: ./.github/workflows/10-node-check.yml
    with:
      comando: lint

  # `prettier --check` NON modifica i file: fallisce se qualcosa non è
  # formattato. In CI si segnala, non si corregge.
  prettier:
    uses: ./.github/workflows/10-node-check.yml
    with:
      comando: format:check
