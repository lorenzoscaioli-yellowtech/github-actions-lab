# Lezione 07 - Automazione di operazioni ripetitive
#
# Caso d'uso: uno script schedulato che aggiorna la documentazione, fa commit
# da solo e (se configurato) avvisa il team su Slack.
#
# Qui: ogni lunedì rigenera `docs/STATO.md` con le statistiche dei workflow
# lette dall'API GitHub e lo pubblica sul branch `automazione/stato`.
#
# Perché non su main: dalla lezione 12 main accetta modifiche solo via PR con
# il check `gate`. Il GITHUB_TOKEN non ha bypass, e una PR aperta con il
# GITHUB_TOKEN non avvia altri workflow, quindi `gate` non partirebbe mai.
# Le alternative per scrivere su un branch protetto sono una GitHub App o una
# deploy key aggiunte al bypass del ruleset: vedi lezioni/07-automazione.md.

name: 07 - Automazione

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # lunedì 06:00 UTC

# `contents: write` per il commit, `actions: read` per leggere i run.
permissions:
  contents: write
  actions: read

jobs:
  aggiorna-stato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rigenero docs/STATO.md
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p docs
          {
            echo "# Stato del laboratorio"
            echo ""
            echo "_Generato automaticamente dal workflow 07 il $(date -u +'%Y-%m-%d %H:%M UTC')._"
            echo ""
            echo "| Workflow | Ultimo esito | Run totali |"
            echo "|---|---|---|"
            gh api "repos/$REPO/actions/workflows" --jq '.workflows[] | "\(.id)\t\(.name)"' |
            while IFS=$'\t' read -r id name; do
              gh api "repos/$REPO/actions/workflows/$id/runs?per_page=1" \
                --jq "\"| $name | \(.workflow_runs[0] | if . == null then \"mai eseguito\" elif .status == \"completed\" then .conclusion else .status end) | \(.total_count) |\""
            done
          } > docs/STATO.md
          cat docs/STATO.md

      # Commit "da bot": l'identità è quella dell'app github-actions, così nel
      # log si distingue dai commit umani. Si pubblica solo se la TABELLA è
      # cambiata: la riga con la data viene esclusa dal confronto, altrimenti
      # ci sarebbe un commit a ogni run.
      - name: Pubblico su automazione/stato se la tabella è cambiata
        id: commit
        env:
          BRANCH: automazione/stato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin "$BRANCH" 2>/dev/null &&
             git show "origin/$BRANCH:docs/STATO.md" > "$RUNNER_TEMP/prima.md" 2>/dev/null &&
             diff -q <(grep -v '^_Generato' "$RUNNER_TEMP/prima.md") \
                     <(grep -v '^_Generato' docs/STATO.md) > /dev/null; then
            echo "Tabella invariata: niente commit"
            echo "cambiato=false" >> "$GITHUB_OUTPUT"
          else
            # Il branch è una fotografia: si riparte da main a ogni
            # aggiornamento e si sovrascrive con --force.
            git checkout -B "$BRANCH"
            git add docs/STATO.md
            git commit -m "docs: aggiorna STATO.md [skip ci]"
            git push --force origin "$BRANCH"
            echo "cambiato=true" >> "$GITHUB_OUTPUT"
            echo "Pubblicato: ${{ github.server_url }}/${{ github.repository }}/blob/$BRANCH/docs/STATO.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  notifica:
    needs: aggiorna-stato
    runs-on: ubuntu-latest
    # Il contesto `secrets` non è ammesso direttamente in `if`: si passa da
    # una variabile d'ambiente. Se il segreto non esiste il job viene saltato
    # invece di fallire.
    env:
      SLACK_CONFIGURATO: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
    steps:
      - name: Avviso su Slack
        if: env.SLACK_CONFIGURATO == 'true'
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Laboratorio: STATO.md aggiornato da ${{ github.workflow }} (run #${{ github.run_number }})\"}" \
            "$WEBHOOK"

      - name: Slack non configurato
        if: env.SLACK_CONFIGURATO != 'true'
        run: |
          echo "Nessun segreto SLACK_WEBHOOK_URL: salto la notifica."
          echo "Per attivarla: gh secret set SLACK_WEBHOOK_URL"
